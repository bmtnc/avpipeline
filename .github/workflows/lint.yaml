name: lint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Set to "true" to fail the build on any lint (once the backlog is cleared).
      LINT_STRICT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Must match renv.lock / Dockerfile (rocker/r-ver:4.4.2); newer R
          # breaks compilation of the pinned package versions (e.g. Rcpp).
          r-version: '4.4.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # lintr is a dev-only tool, not in renv.lock; install it ad hoc.
      - name: Install lintr
        run: Rscript -e 'renv::install("lintr")'

      - name: Lint package
        run: Rscript scripts/lint.R
